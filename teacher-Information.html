<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Registration | Dibya Jyoti</title>
    <style>
        body { background-color: #f4f6f9; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .form-container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; box-sizing: border-box; }
        h2 { text-align: center; margin-bottom: 5px; color: #333; }
        p.subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #444; font-size: 14px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background-color: #28a745; color: white; border: none; padding: 12px; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Teacher Registration</h2>
    <p class="subtitle">Dibya Jyoti Secondary School</p>
    
    <!-- Updated Formspree Endpoint -->
    <form action="https://formspree.io/f/maeypdkd" method="POST">
        
        <div class="input-group">
            <label>Full Name:</label>
            <input type="text" name="name" placeholder="E.g. Jageshwarkumar Kushwaha" required>
        </div>
        
        <div class="input-group">
            <label>Address:</label>
            <input type="text" name="address" placeholder="E.g. Ghorahi, Dang" required>
        </div>
        
        <div class="input-group">
            <label>Contact Number:</label>
            <input type="tel" name="contact" placeholder="E.g. +977-98XXXXXXXX" required>
        </div>
        
        <div class="input-group">
            <label>Facebook Profile Link:</label>
            <input type="url" name="facebook" placeholder="https://facebook.com" required>
        </div>
        
        <div class="input-group">
            <label>Photo URL (Image Link):</label>
            <input type="url" name="photo" placeholder="Paste ImgBB Direct Link here" required>
        </div>
        
        <button type="submit">Submit Information</button>
    </form>
</div>

</body>
</html>
