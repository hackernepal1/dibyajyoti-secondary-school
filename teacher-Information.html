<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Registration | Dibya Jyoti</title>
    <style>
        body { background-color: #f4f6f9; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .form-container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; box-sizing: border-box; }
        h2 { text-align: center; margin-bottom: 5px; color: #333; }
        p.subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #444; font-size: 14px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .input-group input:focus { border-color: #28a745; outline: none; }
        button { width: 100%; background-color: #28a745; color: white; border: none; padding: 12px; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #218838; }
        #message { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Teacher Registration</h2>
    <p class="subtitle">Dibya Jyoti Secondary School</p>
    
    <form id="registrationForm">
        <div class="input-group">
            <label>Full Name:</label>
            <input type="text" id="fullName" placeholder="E.g. Jageshwarkumar Kushwaha" required>
        </div>
        
        <div class="input-group">
            <label>Address:</label>
            <input type="text" id="address" placeholder="E.g. Ghorahi, Dang" required>
        </div>
        
        <div class="input-group">
            <label>Contact Number:</label>
            <input type="tel" id="contactNumber" placeholder="E.g. +977-98XXXXXXXX" required>
        </div>
        
        <div class="input-group">
            <label>Facebook Profile Link:</label>
            <input type="url" id="facebookLink" placeholder="https://facebook.com" required>
        </div>
        
        <div class="input-group">
            <label>Photo URL (Image Link):</label>
            <input type="url" id="photoUrl" placeholder="Paste ImgBB Direct link here" required>
        </div>
        
        <button type="submit">Submit Information</button>
        <div id="message"></div>
    </form>
</div>

<script>
    // आपका टोकन सुरक्षित रूप से यहाँ जोड़ दिया गया है
    const GITHUB_TOKEN = "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"; 
    const REPO_OWNER = "hackernepal1";
    const REPO_NAME = "dibyajyoti-secondary-school";
    const FILE_PATH = "teachers.json";

    document.getElementById('registrationForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const msgDiv = document.getElementById('message');
        msgDiv.style.color = "orange";
        msgDiv.innerText = "Saving information to GitHub...";

        const newTeacher = {
            name: document.getElementById('fullName').value,
            photo: document.getElementById('photoUrl').value,
            address: document.getElementById('address').value,
            contact: document.getElementById('contactNumber').value,
            facebook: document.getElementById('facebookLink').value
        };

        const url = `https://github.com{REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;

        try {
            const res = await fetch(url, {
                headers: { "Authorization": `token ${GITHUB_TOKEN}` }
            });
            
            let currentData = [];
            let sha = "";

            if (res.ok) {
                const fileInfo = await res.json();
                sha = fileInfo.sha;
                const decodedText = decodeURIComponent(escape(atob(fileInfo.content)));
                currentData = JSON.parse(decodedText);
            }

            currentData.push(newTeacher);

            const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(currentData, null, 2))));

            const updateRes = await fetch(url, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${GITHUB_TOKEN}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: `Added new teacher: ${newTeacher.name}`,
                    content: updatedContent,
                    sha: sha
                })
            });

            if (updateRes.ok) {
                msgDiv.style.color = "green";
                msgDiv.innerText = "Registration Success! Data added to website automatically.";
                document.getElementById('registrationForm').reset();
            } else {
                throw new Error("Failed to update GitHub");
            }

        } catch (error) {
            console.error(error);
            msgDiv.style.color = "red";
            msgDiv.innerText = "Error: Could not save data. Please check connection.";
        }
    });
</script>
</body>
</html>
