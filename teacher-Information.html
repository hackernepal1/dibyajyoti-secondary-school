<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Information Form</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; margin: 0; }
        .form-container { max-width: 450px; margin: 30px auto; padding: 25px; border-radius: 8px; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        .form-group input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .submit-btn { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .submit-btn:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Teacher Registration</h2>
    <!-- तपाईंको Formspree Endpoint यहाँ राखिएको छ -->
    <form action="https://formspree.io/f/maeypdkd" method="POST">
        
        <div class="form-group">
            <label>Full Name:</label>
            <input type="text" name="name" placeholder="E.g. Jageshwarkumar Kushwaha" required>
        </div>
        
        <div class="form-group">
            <label>Address:</label>
            <input type="text" name="address" placeholder="E.g. Ghorahi, Dang" required>
        </div>
        
        <div class="form-group">
            <label>Contact Number:</label>
            <input type="tel" name="contact" placeholder="E.g. +977-98XXXXXXXX" required>
        </div>
        
        <div class="form-group">
            <label>Facebook Profile Link:</label>
            <input type="url" name="facebook" placeholder="https://facebook.com" required>
        </div>
        
        <div class="form-group">
            <label>Photo URL (Image Link):</label>
            <input type="url" name="photo" placeholder="Paste image address/link here" required>
        </div>
        
        <button type="submit" class="submit-btn">Submit Information</button>
    </form>
</div>

</body>
</html>
