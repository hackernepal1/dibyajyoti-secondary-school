<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gallery | Dibya Jyoti Secondary School</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/animation.css"></head><body><header class="header"><div class="container nav-wrapper"><a href="index.html" class="brand"><div class="school-logo">DJ</div><div><h1>DIBYA JYOTI</h1><small>SECONDARY SCHOOL</small></div></a><nav><a href="index.html">Home</a><a href="about.html">About</a><a href="academics.html">Academics</a><a href="programs.html">+2 Programs</a><a href="teachers.html">Teachers</a><a href="gallery.html">Gallery</a><a href="videos.html">Videos</a><a href="notices.html">Notices</a><a href="events.html">Events</a><a href="contact.html">Contact</a></nav></div></header><main class="section"><div class="container"><span class="section-label">DIBYA JYOTI SECONDARY SCHOOL</span><h2>Gallery</h2><div id="content" class="gallery">Loading...</div></div></main><script>const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'); fetch('/api/gallery').then(r=>r.json()).then(items=>document.getElementById('content').innerHTML=items.length?items.map(i => `<article><img src="${esc(i.imageUrl)}" alt="${esc(i.title)}" loading="lazy"><h3>${esc(i.title)}</h3><p>${esc(i.caption||"")}</p></article>`).join(""): 'No gallery available.').catch(()=>document.getElementById('content').textContent='Unable to load gallery.');</script></body></html>
