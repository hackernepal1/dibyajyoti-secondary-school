<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Teacher Information</title>
    <style>
        .form-container { max-width: 400px; margin: 30px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; font-family: Arial, sans-serif; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .submit-btn { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Teacher Registration</h2>
    <!-- ACTION URL मा आफ्नो Formspree Endpoint राख्नुहोस् -->
    <form action="https://formspree.io" method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label>Full Name:</label>
            <input type="text" name="name" required>
        </div>
        <div class="form-group">
            <label>Address:</label>
            <input type="text" name="address" required>
        </div>
        <div class="form-group">
            <label>Contact Number:</label>
            <input type="tel" name="contact" required>
        </div>
        <div class="form-group">
            <label>Facebook Profile URL:</label>
            <input type="url" name="facebook" placeholder="https://facebook.com" required>
        </div>
        <div class="form-group">
            <label>Profile Photo:</label>
            <input type="file" name="photo" accept="image/*" required>
        </div>
        <button type="submit" class="submit-btn">Submit Information</button>
    </form>
</div>

</body>
</html>
